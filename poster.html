<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poster · hackercats club admin</title>
  <link rel="icon" href="assets/icons/cat.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/posters.css">
  <style>
    .poster-layout { display: grid; gap: 32px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); align-items: start; }
    .poster-stage { background: var(--web-ink); border-radius: var(--web-radius); padding: 16px; overflow: hidden; }
    .poster-stage__inner { transform-origin: top left; }
    /* Full-size copy used for PNG/PDF export and printing; kept off-screen. */
    #poster-export { position: fixed; left: -10000px; top: 0; }
    @media print {
      @page { size: letter; margin: 0; }
      body > *:not(#poster-export) { display: none !important; }
      body { display: block; min-height: 0; }
      #poster-export { position: static; }
      .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main id="main" tabindex="-1">
    <div class="page-head">
      <div class="wrap">
        <p class="eyebrow">Print</p>
        <h1>Poster</h1>
        <p class="lede">Pick an event and a template, then download a PNG or a letter-size PDF. Everything runs in your browser.</p>
      </div>
    </div>
    <div class="wrap page" id="content"><p class="muted">Loading…</p></div>
  </main>
  <div id="poster-export" aria-hidden="true"></div>

  <!-- PNG/PDF export libraries, pinned to exact versions. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
          integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
          integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="js/demo-seed.js"></script>
  <script src="js/icon-grids.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/poster-templates.js"></script>
  <script src="js/poster.js"></script>
</body>
</html>
