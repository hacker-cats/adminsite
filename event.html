<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event · hackercats club admin</title>
  <link rel="icon" href="assets/icons/cat.svg">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="main" tabindex="-1">
    <div class="page-head">
      <div class="wrap">
        <p class="eyebrow">Events</p>
        <h1 id="page-title">New event</h1>
        <p class="lede">Saved to the club spreadsheet. Unsaved changes are kept as a draft in this browser.</p>
      </div>
    </div>
    <div class="wrap page" id="content"><p class="muted">Loading…</p></div>
  </main>

  <template id="form-template">
    <div id="draft-note"></div>
    <form id="event-form" class="form" novalidate>
      <div id="error-summary"></div>
      <fieldset>
        <legend>Event</legend>
        <div class="form-grid">
          <div class="field span-all">
            <div class="field__top"><label for="f-title">Title</label><span class="field__hint">Required</span></div>
            <input id="f-title" name="title" type="text" aria-describedby="f-title-note" required>
            <p class="field__note" id="f-title-note" hidden></p>
          </div>
          <div class="field span-all">
            <div class="field__top"><label for="f-description">Description</label><span class="field__hint">Optional</span></div>
            <textarea id="f-description" name="description" rows="3" aria-describedby="f-description-note"></textarea>
            <p class="field__note" id="f-description-note">One or two sentences. It goes on the poster.</p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-date">Date</label><span class="field__hint">Required</span></div>
            <input id="f-date" name="date" type="date" aria-describedby="f-date-note" required>
            <p class="field__note" id="f-date-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-startTime">Start time</label><span class="field__hint">Required</span></div>
            <input id="f-startTime" name="startTime" type="time" aria-describedby="f-startTime-note" required>
            <p class="field__note" id="f-startTime-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-endTime">End time</label><span class="field__hint">Required</span></div>
            <input id="f-endTime" name="endTime" type="time" aria-describedby="f-endTime-note" required>
            <p class="field__note" id="f-endTime-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-building">Building</label><span class="field__hint">Required</span></div>
            <input id="f-building" name="building" type="text" aria-describedby="f-building-note" list="buildings" required>
            <p class="field__note" id="f-building-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-room">Room</label><span class="field__hint">Optional</span></div>
            <input id="f-room" name="room" type="text" aria-describedby="f-room-note">
            <p class="field__note" id="f-room-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-attendance">Expected attendance</label><span class="field__hint">Required</span></div>
            <input id="f-attendance" name="attendance" type="number" aria-describedby="f-attendance-note" min="1" inputmode="numeric" required>
            <p class="field__note" id="f-attendance-note" hidden></p>
          </div>
        </div>
        <datalist id="buildings"></datalist>
      </fieldset>

      <fieldset>
        <legend>Food</legend>
        <div class="choices" role="radiogroup" aria-label="Food">
          <label class="check"><input type="radio" name="hasFood" value="no" checked> No food</label>
          <label class="check"><input type="radio" name="hasFood" value="yes"> Serving food</label>
        </div>
        <div id="vendor-field">
          <div class="field">
            <div class="field__top"><label for="f-vendor">Vendor</label><span class="field__hint">Required</span></div>
            <input id="f-vendor" name="vendor" type="text" aria-describedby="f-vendor-note" placeholder="Pizza Campania, Firehouse Subs…">
            <p class="field__note" id="f-vendor-note" hidden></p>
          </div>
        </div>
        <div id="rules" class="stack" style="gap: 12px"></div>
      </fieldset>

      <fieldset>
        <legend>Organizer</legend>
        <div class="form-grid">
          <div class="field">
            <div class="field__top"><label for="f-organizerName">Name</label><span class="field__hint">Required</span></div>
            <input id="f-organizerName" name="organizerName" type="text" aria-describedby="f-organizerName-note" autocomplete="name" required>
            <p class="field__note" id="f-organizerName-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-organizerRole">Role</label><span class="field__hint">Optional</span></div>
            <input id="f-organizerRole" name="organizerRole" type="text" aria-describedby="f-organizerRole-note" placeholder="President">
            <p class="field__note" id="f-organizerRole-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-organizerPhone">Phone</label><span class="field__hint">Optional</span></div>
            <input id="f-organizerPhone" name="organizerPhone" type="tel" aria-describedby="f-organizerPhone-note" autocomplete="tel">
            <p class="field__note" id="f-organizerPhone-note" hidden></p>
          </div>
          <div class="field">
            <div class="field__top"><label for="f-organizerEmail">Email</label><span class="field__hint">Required</span></div>
            <input id="f-organizerEmail" name="organizerEmail" type="email" aria-describedby="f-organizerEmail-note" autocomplete="email" required>
            <p class="field__note" id="f-organizerEmail-note" hidden></p>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Status</legend>
        <div class="choices">
          <label class="check"><input type="checkbox" name="posterMade"> Poster made</label>
          <label class="check"><input type="checkbox" name="frorSent"> Catering email sent</label>
          <label class="check"><input type="checkbox" name="approvalReceived"> Approval received</label>
          <label class="check"><input type="checkbox" name="foodOrdered"> Food ordered</label>
        </div>
          <div class="field">
            <div class="field__top"><label for="f-notes">Notes</label><span class="field__hint">Optional</span></div>
            <textarea id="f-notes" name="notes" rows="2" aria-describedby="f-notes-note"></textarea>
            <p class="field__note" id="f-notes-note" hidden></p>
          </div>
      </fieldset>

      <div class="row">
        <button class="btn" type="submit">Save event</button>
        <a class="btn btn--secondary" href="index.html">Cancel</a>
        <button class="btn btn--ghost" type="button" id="download-json">Download as JSON</button>
        <button class="btn btn--danger hidden" type="button" id="delete" style="margin-left: auto">Delete event</button>
      </div>
    </form>
  </template>

  <script src="config.js"></script>
  <script src="js/demo-seed.js"></script>
  <script src="js/icon-grids.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/event-form.js"></script>
</body>
</html>
